    <circle cx="520" cy="440" r="45"/>
  </g>
  <g fill="#5497e4">
    <circle cx="210" cy="440" r="15"/>
    <circle cx="520" cy="440" r="15"/>
  </g>

  <text x="360" y="365" text-anchor="middle" transform="rotate(-22 360 365)" font-family="'Courier New', monospace" font-weight="700" font-size="92" fill="#e8202a">COMING SOON</text>

  <rect y="600" width="720" height="120" fill="#080808"/>
  <text x="360" y="672" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" letter-spacing="6" fill="#9a9a9a">TRUCK RESTORATION</text>
</svg>
